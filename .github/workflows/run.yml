name: 刷步数

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'  # 北京时间 06:00
    - cron: '0 0 * * *'   # 北京时间 08:00
    - cron: '0 2 * * *'   # 北京时间 10:00
    - cron: '0 4 * * *'   # 北京时间 12:00
    - cron: '0 6 * * *'   # 北京时间 14:00
    - cron: '0 8 * * *'   # 北京时间 16:00
    - cron: '0 10 * * *'  # 北京时间 18:00

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 随机偏移：±20分钟，让每次执行时间不是准点，更自然
      - name: 随机延时
        run: |
          RANDOM_DELAY=$((RANDOM % 1200))
          sleep $RANDOM_DELAY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz pycryptodome

      - name: Run mimotion
        env:
          CONFIG: ${{ secrets.CONFIG }}
        run: python main.py
