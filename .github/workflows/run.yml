name: 刷步数

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'  # 北京时间 06:00
    - cron: '0 0 * * *'   # 北京时间 08:00
    - cron: '0 2 * * *'   # 北京时间 10:00
    - cron: '0 4 * * *'   # 北京时间 12:00
    - cron: '0 6 * * *'   # 北京时间 14:00
    - cron: '0 8 * * *'   # 北京时间 16:00
    - cron: '0 10 * * *'  # 北京时间 18:00

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 随机延时 0~1200秒(20分钟)，模拟真人上传，避免整点特征
      - name: 随机延时
        run: |
          RANDOM_DELAY=$((RANDOM % 1200))
          sleep $RANDOM_DELAY

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz pycryptodome

      - name: 执行mimotion刷步数脚本
        env:
          CONFIG: ${{ secrets.CONFIG }}
        run: python main.py
