name: Keepalive保活
on:
  schedule:
    # UTC时间，每40天自动跑一次空提交，防止60天休眠
    - cron: '0 0 */40 * *'
  workflow_dispatch: # 支持手动触发

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须这个权限，才能push提交
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master # 你的分支是master，不要改

      - name: 空提交保活
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: 自动保活，防止定时任务休眠"
          git push origin master
